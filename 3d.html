<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D | Amandine Mangon</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    :root {
      --pad-x: clamp(18px, 2.3vw, 44px);   /* left/right page margin (same as homepage) */
      --pad-y: clamp(18px, 3.6vh, 40px);   /* top/bottom page margin (same as homepage) */
      --fs: clamp(12px, calc(0.5vw + 6.5px), 17px);
      --thumb-w: min(9vw, 160px);          /* width of the thumbnail column */
      --info-w: 27em;                      /* width of the text (the class line fits on one line) */
      --gap: clamp(14px, 1.5vw, 28px);

      /* The big image column is the same width on every tab. Images fill that
         width, except very tall ones, which are shrunk so they never go taller
         than the screen (nothing is ever cut off). */
      --avail-h: calc(100vh - 2 * var(--pad-y) - 6em);   /* height available under the top bar */
      --img-w: min(
        calc(90vw - var(--thumb-w) - var(--info-w) - 2 * var(--gap)),
        calc(var(--avail-h) * 0.8)
      );
      --row-w: calc(var(--thumb-w) + var(--img-w) + var(--info-w) + 2 * var(--gap));   /* thumbnails + image + text */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { background: #fff; }
    body {
      color: #000;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: var(--fs);
      line-height: 1.25;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:hover,
    .current {
      text-decoration: underline;
      text-decoration-thickness: 0.09em;
      text-underline-offset: 0.18em;
    }

    /* ---------- top left: DIGITAL / GRAPHIC DESIGN + projects ---------- */
    .section-nav {
      position: fixed;
      top: var(--pad-y);
      left: var(--pad-x);
      right: 30vw;
      z-index: 10;
    }
    .nav-row { display: flex; flex-wrap: wrap; column-gap: 1.9em; }
    /* ---------- top right: name, goes home ---------- */
    .site-name {
      position: fixed;
      top: var(--pad-y);
      right: var(--pad-x);
      z-index: 10;
    }

    /* ---------- thumbnails | big image | text ---------- */
    /* the area under the top bar: scrolls on its own when an image is tall */
    .stage {
      position: fixed;
      inset: calc(var(--pad-y) + 4.5em) 0 0 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }
    .stage::-webkit-scrollbar { display: none; }
    .stage-inner {
      min-height: 100%;
      padding: 0 var(--pad-x) calc(var(--pad-y) + 1.5em);
      display: flex;
      align-items: center;              /* short images: centered up and down */
      justify-content: center;
    }

    /* thumbnails | image | text — the same three widths on every tab,
       with the same white space (--gap) between them. */
    .project {
      width: var(--row-w);
      display: flex;
      align-items: flex-start;
      gap: var(--gap);
    }
    .work {
      display: flex;
      align-items: stretch;
      gap: var(--gap);
    }

    /* thumbnail column: as tall as the big image, scrolls on its own */
    .thumbs {
      flex: none;
      width: var(--thumb-w);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }
    .thumbs::-webkit-scrollbar { display: none; }
    .thumb {
      display: block;
      flex: none;
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.2s ease;
    }
    .thumb img { display: block; width: 100%; height: auto; }
    .thumb:hover, .thumb.on { opacity: 1; }
    .thumb:focus:not(:focus-visible) { outline: none; }
    .divider { flex: none; height: 1px; background: #000; }   /* line between the two projects */

    /* big image: always the same width, never cropped */
    .main {
      flex: none;
      width: var(--img-w);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: var(--gap);
    }
    .main img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: var(--avail-h);       /* very tall images shrink to fit the screen */
      transition: opacity 0.25s ease;
    }
    .main img.loading { opacity: 0; transition: none; }

    .main .placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #eee;
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* black border on the images (projects marked border: true) */
    .bordered .main img,
    .bordered .thumb img { border: 1px solid #000; }

    /* projects with one image: no thumbnail column — the image takes its
       space instead, so the row is still the same total width */
    .no-thumbs .thumbs { display: none; }
    .no-thumbs .main { width: calc(var(--img-w) + var(--thumb-w) + var(--gap)); }

    /* all images side by side (projects marked together: true) */
    .main.together img { width: calc((100% - var(--gap)) / 2); }

    /* text: same width on every tab, lined up with the bottom of the image
       (when the image is taller than the screen, it stays in view) */
    .info {
      flex: none;
      width: var(--info-w);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .info-inner { position: sticky; bottom: calc(var(--pad-y) + 1.5em); }
    .info p + p { margin-top: 0; }
    .info .desc { margin-top: 1.3em; }

    /* ---------- click the big image: it opens larger ---------- */
    .main img { cursor: zoom-in; }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.93);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vh 4vw;
      cursor: zoom-out;
    }
    .lightbox[hidden] { display: none; }
    .lightbox img { display: block; max-width: 92vw; max-height: 90vh; }
    /* ---------- phones: big image, thumbnails in a row, then text ---------- */
    @media (max-width: 760px) {
      .stage { position: static; overflow: visible; }
      .stage-inner { display: block; padding-top: calc(var(--pad-y) + 6.5em); }
      .section-nav { right: var(--pad-x); }
      .project, .work { flex-direction: column; align-items: stretch; width: 100%; }
      .project .work { order: 1; }
      .main, .no-thumbs .main { width: 100%; }
      .main img { width: 100%; max-height: none; }
      .thumbs { order: 2; width: 100%; height: auto !important; flex-direction: row; overflow-x: auto; overflow-y: hidden; }
      .no-thumbs .thumbs { display: none; }
      .thumb { width: 22vw; }
      .divider { width: 1px; height: auto; }
      .info { width: auto; }
      .info-inner { position: static; }
    }
  </style>
</head>
<body>

  <nav class="section-nav">
    <div class="nav-row"><span><a class="back" href="digital.html#3d">Digital</a> / 3D</span></div>
    <div class="nav-row" id="tabs"></div>
  </nav>

  <a class="site-name" href="index.html">Amandine Mangon</a>

  <main class="stage" id="stage">
   <div class="stage-inner">
    <div class="project" id="project">
      <div class="thumbs" id="thumbs"></div>
      <div class="work">
        <div class="main" id="main"></div>
        <div class="info">
          <div class="info-inner">
            <p id="info-name"></p>
            <p id="info-class"></p>
            <p class="desc" id="info-desc"></p>
          </div>
        </div>
      </div>
    </div>
   </div>
  </main>
  <!-- larger view: ESC or click anywhere to close, arrows to move -->
  <div class="lightbox" id="lightbox" hidden>
    <img id="lightbox-img" src="" alt="">
  </div>
  <script>
    /* ==============================================================
       PROJECTS — one tab each, in this order. Images are in the "3d" folder.
       Images that aren't in the folder yet are simply skipped, so you can
       list more than you have (e.g. record1 to record6).
       desc = the line under the class, about what you see
       ============================================================== */
    var CLASS_LINE = "3D Modeling; NYU IDM.";      // add the semester, e.g. "3D Modeling; NYU IDM, Spring 2026."

    var PROJECTS = [
      { id: "room", name: "Room", parts: [
        { desc: "A room modeled, lit, and rendered; Autodesk Maya.", images: [
          "3d/room1.jpg", "3d/room2.jpg", "3d/room3.jpg", "3d/room4.jpg", "3d/room5.jpg", "3d/room6.jpg"
        ]}
      ]},
      { id: "record-player", name: "Record Player", parts: [
        { desc: "A record player modeled and rendered; Autodesk Maya.", images: [
          "3d/record1.jpg", "3d/record2.jpg", "3d/record3.jpg", "3d/record4.jpg", "3d/record5.jpg", "3d/record6.jpg"
        ]}
      ]}
    ];

    /* ============================================================== */

    (function () {
      var tabs = document.getElementById("tabs");
      var thumbs = document.getElementById("thumbs");
      var main = document.getElementById("main");
      var projectEl = document.getElementById("project");
      var mainImg = document.createElement("img");
      mainImg.addEventListener("load", function () { mainImg.classList.remove("loading"); });
      mainImg.addEventListener("error", function () { mainImg.classList.remove("loading"); });
      var infoName = document.getElementById("info-name");
      var infoClass = document.getElementById("info-class");
      var infoDesc = document.getElementById("info-desc");

      var project, flat = [], current = 0;

      // ----- click the big image to see it larger -----
      var box = document.getElementById("lightbox");
      var big = document.getElementById("lightbox-img");
      function openBig(src) {
        big.src = src;
        box.hidden = false;
        document.body.style.overflow = "hidden";
      }
      function closeBig() {
        box.hidden = true;
        document.body.style.overflow = "";
      }
      mainImg.addEventListener("click", function () { openBig(flat[current].src); });
      box.addEventListener("click", closeBig);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !box.hidden) closeBig();
      });
      // tabs: LAURA  BLUE FATHER  ICONOCLAST ...
      PROJECTS.forEach(function (p) {
        var a = document.createElement("a");
        a.href = "#" + p.id;
        a.textContent = p.name;
        a.setAttribute("data-id", p.id);
        tabs.appendChild(a);
      });

      function show(i) {
        if (!flat.length) return;
        current = (i + flat.length) % flat.length;
        var item = flat[current];
        if (!project.together) {
          if (mainImg.getAttribute("src") !== item.src) {
            mainImg.classList.add("loading");          // hide the old picture until the new one is ready
            mainImg.src = item.src;
          }
          mainImg.alt = project.name;
        }
         if (!box.hidden) big.src = item.src;
        infoName.textContent = project.name;
        infoClass.textContent = CLASS_LINE;
        infoDesc.textContent = item.part.desc;
        Array.prototype.forEach.call(thumbs.querySelectorAll(".thumb"), function (t, n) {
          t.classList.toggle("on", n === current);
        });
        var on = thumbs.querySelectorAll(".thumb")[current];
        if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest", inline: "nearest" });
      }

      // which images are actually in the folder (missing ones are skipped)
      var loadCount = 0;
      function exists(src) {
        return new Promise(function (done) {
          var im = new Image();
          im.onload = function () { done(true); };
          im.onerror = function () { done(false); };
          im.src = src;
        });
      }

      function load() {
        var id = (location.hash || "").slice(1).toLowerCase();
        project = PROJECTS.filter(function (p) { return p.id === id; })[0] || PROJECTS[0];
        Array.prototype.forEach.call(tabs.children, function (a) {
          a.classList.toggle("current", a.getAttribute("data-id") === project.id);
        });
        document.title = project.name + " | Amandine Mangon";

        var myLoad = ++loadCount;
        var all = [];
        project.parts.forEach(function (part) { part.images.forEach(function (src) { all.push(src); }); });
        Promise.all(all.map(exists)).then(function (ok) {
          if (myLoad !== loadCount) return;            // switched tabs meanwhile
          var have = {};
          all.forEach(function (src, i) { if (ok[i]) have[src] = true; });
          build(have);
        });
      }

      function build(have) {
        thumbs.innerHTML = "";
        flat = [];
        project.parts.forEach(function (part, pi) {
          if (pi > 0) {
            var line = document.createElement("div");
            line.className = "divider";
            thumbs.appendChild(line);
          }
          part.images.forEach(function (src) {
            if (!have[src]) return;                    // not in the folder yet
            var i = flat.length;
            flat.push({ src: src, part: part });
            var b = document.createElement("button");
            b.className = "thumb";
            b.type = "button";
            b.setAttribute("aria-label", "Show image " + (i + 1));
            var img = document.createElement("img");
            img.src = src;
            img.alt = "";
            b.appendChild(img);
            b.addEventListener("click", function () { show(i); });
            thumbs.appendChild(b);
          });
        });
        thumbs.scrollTop = 0;

        projectEl.classList.toggle("bordered", !!project.border);
        thumbs.style.setProperty("--count", flat.length);
        projectEl.classList.toggle("no-thumbs", !!project.together || flat.length < 2);
        main.classList.toggle("together", !!project.together);
        main.innerHTML = "";
        if (project.together) {
          flat.forEach(function (item) {
            var img = document.createElement("img");
            img.src = item.src;
            img.alt = project.name;
            main.appendChild(img);
          });
        } else if (flat.length) {
          main.appendChild(mainImg);
        } else {
          var ph = document.createElement("div");      // no images yet
          ph.className = "placeholder";
          ph.textContent = "Images coming soon";
          main.appendChild(ph);
          infoName.textContent = project.name;
          infoClass.textContent = CLASS_LINE;
          infoDesc.textContent = project.parts[0].desc;
          return;
        }
        show(0);
      }

      window.addEventListener("hashchange", load);
      load();

      // arrow keys move through the images (← → or ↑ ↓)
      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); show(current + 1); }
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); show(current - 1); }
      });

      // the thumbnail column is always exactly as tall as the big image
      var stage = document.getElementById("stage");
      function matchThumbs() {
        if (window.matchMedia("(max-width: 760px)").matches) return;
        thumbs.style.height = main.offsetHeight + "px";
      }
      main.addEventListener("load", matchThumbs, true);   // whenever a big image finishes loading
      window.addEventListener("resize", matchThumbs);
      window.addEventListener("hashchange", function () { stage.scrollTop = 0; });

      // scrolling: if the image is taller than the screen, the page scrolls;
      // otherwise scrolling anywhere moves the thumbnail column
      window.addEventListener("wheel", function (e) {
        if (window.matchMedia("(max-width: 760px)").matches) return;
        if (thumbs.contains(e.target)) return;
        if (stage.scrollHeight > stage.clientHeight + 1) return;
        thumbs.scrollTop += e.deltaY;
      }, { passive: true });
    })();
  </script>
    <script src="menu.js"></script>
</body>
</html>
