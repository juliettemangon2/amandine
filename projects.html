<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects | Amandine Mangon</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    :root {
      --pad-x: clamp(18px, 2.3vw, 44px);   /* left/right page margin (same as homepage) */
      --pad-y: clamp(18px, 3.6vh, 40px);   /* top/bottom page margin (same as homepage) */
      --fs: clamp(12px, calc(0.5vw + 6.5px), 17px);
      --gap: clamp(4px, 0.45vw, 8px);      /* space between images */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { background: #fff; }
    body {
      color: #000;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: var(--fs);
      line-height: 1.25;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:hover,
    .current {
      text-decoration: underline;
      text-decoration-thickness: 0.09em;
      text-underline-offset: 0.18em;
    }

    /* ---------- top left: PROJECTS + its pages ---------- */
    .section-nav {
      position: fixed;
      top: var(--pad-y);
      left: var(--pad-x);
      z-index: 10;
    }
    .nav-row { display: flex; flex-wrap: wrap; column-gap: 0.95em; }

    /* ---------- top right: name, goes home ---------- */
    .site-name {
      position: fixed;
      top: var(--pad-y);
      right: var(--pad-x);
      z-index: 10;
    }

    /* ---------- images + caption, centered ---------- */
    .stage {
      height: 100vh;
      height: 100dvh;
      padding: calc(var(--pad-y) + 4.5em) var(--pad-x) calc(var(--pad-y) + 1.5em);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .work {
      display: flex;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .work.ready { opacity: 1; }
    .fit { display: flex; gap: var(--gap); }
    .fit-col { display: flex; flex-direction: column; gap: var(--gap); }
    .tile {
      display: block;
      padding: 0;
      border: 0;
      background: #f1f1f1;
      cursor: pointer;
    }
    .tile img {
      display: block;
      width: 100%;
      height: 100%;
      transition: opacity 0.25s ease;
    }
    .tile:hover img { opacity: 0.82; }
    .tile:focus:not(:focus-visible) { outline: none; }

    /* grey box standing in until the images are added */
    .placeholder {
      background: #eee;
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .caption { margin-top: 1.1em; line-height: 1.3; }

    /* text-only tabs (like ineverseeyou): title on top, paragraphs under */
    .text-page { width: min(56vw, 48em); line-height: 1.3; margin: auto 0; }
    /* text tabs scroll under the top bar when they're taller than the screen */
    .stage.scroll {
      position: fixed;
      inset: calc(var(--pad-y) + 4.5em) 0 0 0;
      height: auto;
      padding-top: 0;
      align-items: flex-start;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .stage.scroll::-webkit-scrollbar { display: none; }
    .photo-row { display: flex; gap: var(--gap); margin-top: 2.2em; }

    /* ---------- gallery tabs (Heritage): big title, then thumbnails | image | text ---------- */
    .gallery-page {
      --g-gap: clamp(14px, 1.5vw, 28px);
      --thumb-w: min(9vw, 160px);
      --info-w: 27em;
      --title-size: clamp(44px, 6.5vw, 112px);
      /* height left for the big image under the top bar and the title */
      --g-avail: calc(100vh - 2 * var(--pad-y) - 6em - 1.25 * var(--title-size));
      --g-img-w: min(
        calc(90vw - var(--thumb-w) - var(--info-w) - 2 * var(--g-gap)),
        calc(var(--g-avail) * 1.1)
      );
      margin: auto 0;
    }
    .brand-title {
      color: #d6829b;
      font-size: var(--title-size);
      font-weight: 700;
      text-transform: none;              /* stays lowercase */
      letter-spacing: -0.02em;
      line-height: 0.9;
      margin-bottom: 0.3em;
    }
    .g-row { display: flex; align-items: flex-start; gap: var(--g-gap); }
    .g-thumbs {
      flex: none;
      width: var(--thumb-w);
      display: flex;
      flex-direction: column;
      gap: var(--g-gap);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }
    .g-thumbs::-webkit-scrollbar { display: none; }
    .g-thumbs .thumb {
      display: block; flex: none; width: 100%;
      padding: 0; border: 0; background: none; cursor: pointer;
      opacity: 0.45; transition: opacity 0.2s ease;
    }
    .g-thumbs .thumb img { display: block; width: 100%; height: auto; }
    .g-thumbs .thumb:hover, .g-thumbs .thumb.on { opacity: 1; }
    .g-main {
      flex: none;
      width: var(--g-img-w);
      display: flex;
      justify-content: center;
    }
    .g-main img {
      display: block;
      width: auto; height: auto;
      max-width: 100%;
      max-height: var(--g-avail);
      cursor: zoom-in;
    }
    .g-main .placeholder { width: 100%; aspect-ratio: 4 / 3; }
    .g-info { flex: none; width: var(--info-w); align-self: flex-end; line-height: 1.3; }
    .g-info p + p { margin-top: 1.3em; }
    .g-info a {
      text-decoration: underline;
      text-decoration-thickness: 0.09em;
      text-underline-offset: 0.18em;
    }
    .g-info a:hover { opacity: 0.6; }
    .photo-row .tile { flex: none; }
    .text-page p + p { margin-top: 1.3em; }
    .text-page .title { margin-bottom: 1.3em; }
    .text-page a {
      text-decoration: underline;
      text-decoration-thickness: 0.09em;
      text-underline-offset: 0.18em;
    }
    .text-page a:hover { opacity: 0.6; }
    @media (max-width: 760px) {
      .text-page { width: 100%; }
      .stage.scroll { position: static; overflow: visible; padding-top: calc(var(--pad-y) + 6em); }
      .photo-row { flex-wrap: wrap; }
      .gallery-page { width: 100%; }
      .g-row { flex-direction: column; }
      .g-main, .g-info { width: 100%; }
      .g-main img { max-height: none; width: 100%; }
      .g-thumbs { order: 2; width: 100%; height: auto !important; flex-direction: row; overflow-x: auto; }
      .g-thumbs .thumb { width: 22vw; }
      .g-info { order: 3; }
    }
    .caption .desc { margin-top: 1.3em; }
    .caption p:empty { display: none; }

    /* ---------- enlarged image ---------- */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.93);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vh 4vw;
      cursor: pointer;
    }
    .lightbox[hidden] { display: none; }
    .lightbox img { max-width: 92vw; max-height: 90vh; }
    body.lb-open { overflow: hidden; }

    /* ---------- phones: scroll down ---------- */
    @media (max-width: 760px) {
      .stage { height: auto; overflow: visible; align-items: flex-start; padding-top: calc(var(--pad-y) + 6em); }
    }
  </style>
</head>
<body>

  <nav class="section-nav">
    <div class="nav-row"><span>Projects</span></div>
    <div class="nav-row" id="tabs"></div>
  </nav>

  <a class="site-name" href="index.html">Amandine Mangon</a>

  <main class="stage" id="stage">
    <div class="text-page" id="text-page" hidden></div>
    <div class="gallery-page" id="gallery-page" hidden>
      <h1 class="brand-title" id="brand-title"></h1>
      <div class="g-row">
        <div class="g-thumbs" id="g-thumbs"></div>
        <div class="g-main" id="g-main"></div>
        <div class="g-info" id="g-info"></div>
      </div>
    </div>
    <div class="work" id="work">
      <div class="fit" id="fit"></div>
      <div class="caption" id="caption"></div>
    </div>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    /* ==============================================================
       PROJECTS — one tab each, in this order.

       folder  = where its images are (make this folder next to this file)
       images  = the image file names, in order. Add as many as you want:
                   images: ["one.jpeg", "two.jpeg", "three.jpeg"],
       columns = how many images across (they all fit together in
                 one clean rectangle, never stretched or cropped)
       classLine / desc = the caption underneath (leave "" for none;
                 desc can have several lines, each "..." is one line)
       ============================================================== */
    var PROJECTS = [
      {
        id: "heritage",
        name: "Heritage",
        // gallery: true = laid out like Graphic Design: thumbnails on the left,
        // the big image in the middle, the text on the right.
        gallery: true,
        brandTitle: "heritage",     // the big pink word at the top
        folder: "projects/heritage/",
        images: [
          "heritage1.jpeg", "heritage2.jpeg", "heritage3.jpeg", "heritage4.jpeg",
          "heritage5.jpeg", "heritage6.jpeg", "heritage7.jpeg", "heritage8.jpeg"
        ],
        text: [
          '<a href="https://heritage.international/index.html" target="_blank" rel="noopener">Heritage</a> ' +
          'started from one observation: the most interesting people are often lonely in the way only ambitious, ' +
          'creative people can be. Not for lack of a social life, but for lack of the right one.',

          'Heritage is not a networking app or a social media platform. It connects ambitious people to culturally ' +
          'and personally relevant experiences: the right rooms and the right people. Every experience is handpicked, ' +
          'with no open invites, because shared experience is the fastest path to real connection. ' +
          'Heritage is launching in New York City.',

          'I worked on Heritage’s brand imagery, the UI/UX design of the app, and market research.'
        ]
      },
      {
        id: "ineverseeyou",
        name: "ineverseeyou",
        // text: [...] = this tab shows writing instead of images.
        // Each "..." is one paragraph (joined with + when it's long).
        text: [
          '<a href="https://ineverseeyou.com/" target="_blank" rel="noopener">ineverseeyou</a> is an art collective ' +
          'co-founded by Amandine Mangon: a group of creative people from different disciplines who share an interest ' +
          'in art and technology. Through our work, we imagine new ways for nature, humans, and machines to live together.',

          '<a href="code.html#exquisite-corpse">Exquisite Corpse</a> and ' +
          '<a href="code.html#five-stages-of-grief">The Five Stages of Grief</a> were both made for ineverseeyou, ' +
          'as part of our first cycle.',

          'I also designed the website for <a href="https://ineverseeyou.com/origin.html" target="_blank" rel="noopener">Origin</a>. ' +
          'Because it is our first work, it is inspired by the Garden of Eden and Pandora’s box. When you open Origin, ' +
          'two Pandora’s boxes appear, each one opening one of its two parts. The first is a painting of the ' +
          'Garden of Eden with our work blended into it as a collage.'
        ]
      },
      {
        id: "juma",
        name: "Juma",
        folder: "projects/juma/",
        text: [
          'Juma is a jewelry brand co-founded by Juliette Mangon and Julia Majchrzak. Each piece is made from handmade ' +
          'glass beads and pendants, cord cut from leather and suede, and a range of found materials. At its core, Juma ' +
          'is an attempt to rethink what jewelry can be beyond an accessory: a form of wearable art, where color and ' +
          'shape play out on the body the way they would on a canvas.',

          'Two principles guide our work. The first is that jewelry should be for everyone: our pieces are unisex by ' +
          'design, made from the start to be worn by anyone. The second is a commitment to sustainability and ' +
          'versatility. We work with found objects, secondhand leather and suede, and remnant glass wherever possible, ' +
          'and we design each necklace to be worn in more than one way: cords can be tied differently, beads can be ' +
          'added or removed, and pieces can be combined with one another to create new looks.',

          'I take part in every stage of the process, from beadmaking and sourcing materials to designing the jewelry ' +
          'and directing campaign photography.'
        ],
        // photos under the text, in one row, all the same height (click to enlarge)
        images: ["juma1.jpeg", "juma2.jpeg", "juma3.jpeg", "juma4.jpeg"]
      }
    ];
    var PHONE_COLUMNS = 2;

    /* ============================================================== */

    (function () {
      var tabs = document.getElementById("tabs");
      var stage = document.getElementById("stage");
      var work = document.getElementById("work");
      var fit = document.getElementById("fit");
      var caption = document.getElementById("caption");
      var textPage = document.getElementById("text-page");
      var galleryPage = document.getElementById("gallery-page");
      var gThumbs = document.getElementById("g-thumbs");
      var gMain = document.getElementById("g-main");
      var gInfo = document.getElementById("g-info");
      var gImg = document.createElement("img");
      var gCurrent = 0;
      gImg.addEventListener("load", matchGalleryThumbs);
      gImg.addEventListener("click", function () { openBox(gCurrent); });
      var project, srcs = [], ratios = [], tiles = [], loadId = 0;

      PROJECTS.forEach(function (p) {
        var a = document.createElement("a");
        a.href = "#" + p.id;
        a.textContent = p.name;
        a.setAttribute("data-id", p.id);
        tabs.appendChild(a);
      });

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      // width ÷ height of an image (0 = missing / not added yet)
      function ratioOf(img) {
        return new Promise(function (done) {
          function finish() { done(img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 0); }
          if (img.complete) return finish();
          img.addEventListener("load", finish);
          img.addEventListener("error", finish);
        });
      }

      function load() {
        var id = (location.hash || "").slice(1).toLowerCase();
        project = PROJECTS.filter(function (p) { return p.id === id; })[0] || PROJECTS[0];
        Array.prototype.forEach.call(tabs.children, function (a) {
          a.classList.toggle("current", a.getAttribute("data-id") === project.id);
        });
        document.title = project.name + " | Amandine Mangon";
        closeBox();
        work.classList.remove("ready");

        galleryPage.hidden = true;

        // gallery tab (Heritage): title, thumbnails | big image | text
        if (project.gallery) {
          loadId++;
          var myGal = loadId;
          textPage.hidden = true;
          work.style.display = "none";
          galleryPage.hidden = false;
          stage.classList.add("scroll");
          stage.scrollTop = 0;
          document.getElementById("brand-title").textContent = project.brandTitle || project.name;
          gInfo.innerHTML = "";
          (project.text || []).forEach(function (html) {
            var p = el("p");
            p.innerHTML = html;
            gInfo.appendChild(p);
          });
          gThumbs.innerHTML = "";
          gMain.innerHTML = "";
          srcs = []; tiles = []; ratios = [];
          var gAll = (project.images || []).map(function (f) { return project.folder + encodeURIComponent(f); });
          var gImgs = gAll.map(function (src) { var img = new Image(); img.src = src; return img; });
          Promise.all(gImgs.map(ratioOf)).then(function (rs) {
            if (myGal !== loadId) return;
            gImgs.forEach(function (img, i) {
              if (!rs[i]) return;                 // not added yet → skip it
              var n = srcs.length;
              srcs.push(gAll[i]);
              var b = el("button", "thumb");
              b.type = "button";
              b.setAttribute("aria-label", "Show image " + (n + 1));
              img.alt = "";
              b.appendChild(img);
              b.addEventListener("click", function () { galleryShow(n); });
              gThumbs.appendChild(b);
            });
            gThumbs.style.visibility = srcs.length > 1 ? "" : "hidden";
            if (srcs.length) {
              gMain.appendChild(gImg);
              galleryShow(0);
            } else {
              gMain.appendChild(el("div", "placeholder", "Images coming soon"));
              matchGalleryThumbs();
            }
          });
          return;
        }

        // text-only tab: show the writing, hide the images
        if (project.text) {
          loadId++;
          textPage.innerHTML = "";
          var t = el("p", "title", project.name);
          textPage.appendChild(t);
          project.text.forEach(function (html) {
            var p = el("p");
            p.innerHTML = html;
            textPage.appendChild(p);
          });
          textPage.hidden = false;
          work.style.display = "none";
          stage.classList.add("scroll");
          stage.scrollTop = 0;
          srcs = []; tiles = []; ratios = [];

          // photos under the text (any not added yet are skipped)
          var row = el("div", "photo-row");
          textPage.appendChild(row);
          var myText = loadId;
          var all = (project.images || []).map(function (f) { return project.folder + encodeURIComponent(f); });
          var imgs = all.map(function (src) { var img = new Image(); img.src = src; return img; });
          Promise.all(imgs.map(ratioOf)).then(function (rs) {
            if (myText !== loadId) return;
            imgs.forEach(function (img, i) {
              if (!rs[i]) return;
              var n = srcs.length;
              srcs.push(all[i]);
              ratios.push(rs[i]);
              var b = el("button", "tile");
              b.type = "button";
              b.setAttribute("aria-label", "Open " + project.name + " photo " + (n + 1));
              img.alt = "";
              b.appendChild(img);
              b.addEventListener("click", function () { openBox(n); });
              tiles.push(b);
              row.appendChild(b);
            });
            sizePhotos();
          });
          return;
        }
        textPage.hidden = true;
        work.style.display = "";
        stage.classList.remove("scroll");

        // caption
        caption.innerHTML = "";
        caption.appendChild(el("p", null, project.name));
        caption.appendChild(el("p", null, project.classLine || ""));
        (project.desc || []).forEach(function (line, i) {
          caption.appendChild(el("p", i === 0 ? "desc" : null, line));
        });

        // images
        var myLoad = ++loadId;
        var all = (project.images || []).map(function (f) { return project.folder + encodeURIComponent(f); });
        var imgs = all.map(function (src) { var img = new Image(); img.src = src; return img; });
        Promise.all(imgs.map(ratioOf)).then(function (rs) {
          if (myLoad !== loadId) return;           // switched tabs meanwhile
          srcs = []; ratios = []; tiles = [];
          imgs.forEach(function (img, i) {
            if (!rs[i]) return;                     // file not there yet → skip it
            var n = srcs.length;
            srcs.push(all[i]);
            ratios.push(rs[i]);
            var b = el("button", "tile");
            b.type = "button";
            b.setAttribute("aria-label", "Open " + project.name + " image " + (n + 1));
            img.alt = "";
            b.appendChild(img);
            b.addEventListener("click", function () { openBox(n); });
            tiles.push(b);
          });
          layout();
          work.classList.add("ready");
        });
      }

      /* Images go into columns (across, then the next row). Each column gets
         its own width so every column ends at the same height — the set makes
         one clean rectangle. The caption sits underneath, the same width. */
      // gallery: show image i big, light up its thumbnail
      function galleryShow(i) {
        if (!srcs.length) return;
        gCurrent = (i + srcs.length) % srcs.length;
        gImg.src = srcs[gCurrent];
        gImg.alt = project.name;
        Array.prototype.forEach.call(gThumbs.children, function (t, n) {
          t.classList.toggle("on", n === gCurrent);
        });
        var on = gThumbs.children[gCurrent];
        if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest" });
      }
      // the thumbnail column is as tall as the big image
      function matchGalleryThumbs() {
        if (window.matchMedia("(max-width: 760px)").matches) return;
        gThumbs.style.height = gMain.offsetHeight + "px";
      }

      // photos in one row, all the same height, exactly as wide as the text
      function sizePhotos() {
        var row = textPage.querySelector(".photo-row");
        if (!row || !tiles.length) return;
        var phone = window.matchMedia("(max-width: 760px)").matches;
        var gap = parseFloat(getComputedStyle(row).columnGap) || 6;
        if (phone) {
          tiles.forEach(function (t, i) {
            var w = (textPage.clientWidth - gap) / 2;
            t.style.width = w + "px"; t.style.height = w / ratios[i] + "px";
          });
          return;
        }
        var W = textPage.clientWidth - (tiles.length - 1) * gap;
        var h = W / ratios.reduce(function (a, r) { return a + r; }, 0);
        tiles.forEach(function (t, i) {
          t.style.width = h * ratios[i] + "px";
          t.style.height = h + "px";
        });
      }

      function layout() {
        if (project && project.gallery) { matchGalleryThumbs(); return; }
        if (project && project.text) { sizePhotos(); return; }
        if (!project) return;
        var phone = window.matchMedia("(max-width: 760px)").matches;
        var gap = parseFloat(getComputedStyle(fit).columnGap) || 6;
        var cs = getComputedStyle(stage);
        var W = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        caption.style.width = Math.min(W, window.innerWidth * 0.6) + "px";
        var capH = caption.offsetHeight + parseFloat(getComputedStyle(caption).marginTop);
        var H = phone ? Infinity : stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - capH;
        var maxW = phone ? W : Math.min(W, window.innerWidth * 0.8);

        fit.innerHTML = "";

        if (!tiles.length) {                        // no images yet: one grey box
          var w = Math.min(maxW * 0.75, H * 1.5);
          var ph = el("div", "placeholder", "Images coming soon");
          ph.style.width = w + "px";
          ph.style.height = w / 1.5 + "px";
          fit.appendChild(ph);
          caption.style.width = w + "px";
          return;
        }

        var k = Math.min(phone ? PHONE_COLUMNS : (project.columns || 3), tiles.length);
        var cols = [];
        for (var c = 0; c < k; c++) cols.push([]);
        ratios.forEach(function (r, i) { cols[i % k].push(i); });

        // for a column of width w: height = w × S + (n − 1) × gap
        var S = cols.map(function (col) { return col.reduce(function (s, i) { return s + 1 / ratios[i]; }, 0); });
        var num = maxW - (k - 1) * gap, den = 0;
        cols.forEach(function (col, c) { num += gap * (col.length - 1) / S[c]; den += 1 / S[c]; });
        var height = Math.min(H, num / den);

        var total = 0;
        cols.forEach(function (col, c) {
          var w = (height - (col.length - 1) * gap) / S[c];
          total += w;
          var colEl = el("div", "fit-col");
          colEl.style.width = w + "px";
          col.forEach(function (i) {
            tiles[i].style.width = w + "px";
            tiles[i].style.height = w / ratios[i] + "px";
            colEl.appendChild(tiles[i]);
          });
          fit.appendChild(colEl);
        });
        caption.style.width = total + (k - 1) * gap + "px";
      }

      // ----- enlarged view: ESC or click anywhere to close, arrows to move -----
      var box = document.getElementById("lightbox");
      var big = document.getElementById("lightbox-img");
      var current = -1;

      function show(i) {
        current = (i + srcs.length) % srcs.length;
        big.src = srcs[current];
      }
      function openBox(i) {
        show(i);
        box.hidden = false;
        document.body.classList.add("lb-open");
      }
      function closeBox() {
        // gallery: the big image follows where you were in the enlarged view
        if (current >= 0 && project && project.gallery && !box.hidden) galleryShow(current);
        box.hidden = true;
        current = -1;
        document.body.classList.remove("lb-open");
      }

      box.addEventListener("click", closeBox);
      document.addEventListener("keydown", function (e) {
        // gallery tab, nothing enlarged: arrows move through the images
        if (current < 0 && project && project.gallery && srcs.length) {
          if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); galleryShow(gCurrent + 1); }
          else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); galleryShow(gCurrent - 1); }
          return;
        }
        if (current < 0) return;
        if (e.key === "Escape") closeBox();
        else if (e.key === "ArrowRight") { e.preventDefault(); show(current + 1); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); show(current - 1); }
      });

      // swipe on phones
      var startX = null;
      box.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; }, { passive: true });
      box.addEventListener("touchend", function (e) {
        if (startX === null || current < 0) return;
        var dx = e.changedTouches[0].clientX - startX;
        startX = null;
        if (dx > 40) show(current - 1);
        else if (dx < -40) show(current + 1);
      });

      var t;
      window.addEventListener("resize", function () { clearTimeout(t); t = setTimeout(layout, 60); });
      window.addEventListener("hashchange", load);
      load();
    })();
  </script>

</body>
