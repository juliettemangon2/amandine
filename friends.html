<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friends | Amandine Mangon</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    :root {
      --pad-x: clamp(18px, 2.3vw, 44px);   /* left/right page margin (same as homepage) */
      --pad-y: clamp(18px, 3.6vh, 40px);   /* top/bottom page margin (same as homepage) */
      --fs: clamp(12px, calc(0.5vw + 6.5px), 17px);
      --gap: clamp(4px, 0.45vw, 8px);      /* space between collages */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { background: #fff; }
    body {
      color: #000;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: var(--fs);
      line-height: 1.25;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:hover,
    .current {
      text-decoration: underline;
      text-decoration-thickness: 0.09em;
      text-underline-offset: 0.18em;
    }

    /* ---------- top left: COLLAGE + its pages ---------- */
    .section-nav {
      position: fixed;
      top: var(--pad-y);
      left: var(--pad-x);
      z-index: 10;
    }
    .nav-row { display: flex; flex-wrap: wrap; column-gap: 0.95em; }

    /* ---------- top right: name, goes home ---------- */
    .site-name {
      position: fixed;
      top: var(--pad-y);
      right: var(--pad-x);
      z-index: 10;
    }

    /* ---------- 3 x 3 grid ---------- */
    .stage {
      height: 100vh;
      height: 100dvh;
      padding: calc(var(--pad-y) + 4.5em) var(--pad-x) calc(var(--pad-y) + 1.5em);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, var(--cell-w));
      grid-auto-rows: var(--cell-h);
      gap: var(--gap);
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .grid.ready { opacity: 1; }
    .tile {
      display: block;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }
    .tile img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;      /* whole collage shows, never stretched */
      transition: opacity 0.25s ease;
    }
    .tile:hover img { opacity: 0.82; }
    .tile:focus:not(:focus-visible) { outline: none; }

    /* ---------- enlarged view: collage left, name + text right ---------- */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.93);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vh 4vw;
      cursor: pointer;
    }
    .lightbox[hidden] { display: none; }
    .lb-content {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 2.4em;
    }
    .lb-content img {
      display: block;
      max-width: 58vw;
      max-height: 88vh;
    }
    .lb-text { width: 26vw; max-width: 30em; }
    .lb-name { margin-bottom: 0.7em; }
    .lb-caption { line-height: 1.55; }
    body.lb-open { overflow: hidden; }

    /* ---------- phones: scroll down, text under the collage ---------- */
    @media (max-width: 760px) {
      .stage { height: auto; overflow: visible; align-items: flex-start; }
      .lb-content { flex-direction: column; align-items: center; gap: 1.2em; }
      .lb-content img { max-width: 92vw; max-height: 62vh; }
      .lb-text { width: 92vw; }
    }
  </style>
</head>
<body>

  <nav class="section-nav">
    <div class="nav-row"><a href="postcards.html">Collage</a></div>
    <div class="nav-row">
      <a href="postcards.html">Postcards</a>
      <a href="friends.html" class="current">Friends</a>
      <a href="girl.html">Girl</a>
    </div>
  </nav>

  <a class="site-name" href="index.html">Amandine Mangon</a>

  <main class="stage" id="stage">
    <div class="grid" id="grid"></div>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-content">
      <img id="lb-img" src="" alt="">
      <div class="lb-text">
        <div class="lb-name" id="lb-name"></div>
        <div class="lb-caption" id="lb-caption"></div>
      </div>
    </div>
  </div>

  <script>
    /* ==============================================================
       FRIENDS — in order. Images are in the "friends" folder.
       ============================================================== */
    var FRIENDS = [
      { name: "Santi",    src: "friends/santi.jpeg",    caption: "Santi likes to go rock climbing with his friends. He enjoys a black coffee for breakfast, and that's it. He indulges in a cigarette once in a while, and always has a shoulder to lean on." },
      { name: "Laura",    src: "friends/laura.jpeg",    caption: "Laura’s favorite color is pink and she likes to spend time outdoors. She also enjoys nicotine products." },
      { name: "Justice",  src: "friends/justice.jpeg",  caption: "Justice is known for wearing an ERD rat broach on his hat. He wears silver jewelry and likes to smoke with friends." },
      { name: "Frankie",  src: "friends/frankie.jpeg",  caption: "Frankie lives in NYC and plays many instruments including the piano. She has a lighter with her name engraved on it. She likes florals and going on walks." },
      { name: "Mateo",    src: "friends/mateo.jpeg",    caption: "Mateo used to live in Iowa and now lives in New York City. In both his personal and work life he is a photographer. He wears black broken rosary beads." },
      { name: "Juliette", src: "friends/juliette.jpeg", caption: "Juliette spends her summers in the south of France going to the beach. She loves clothes, especially dresses, and has a growing collection of perfumes." },
      { name: "Sophia",   src: "friends/sophia.jpeg",   caption: "Sophia lives in London, but is also part Danish. She has a great taste in fashion and enjoys going out for drinks with her friends. She also has horses." },
      { name: "Ava",      src: "friends/ava.jpeg",      caption: "Ava studies politics and likes the cold weather. She likes listening to music, and has a poster of John Coltrane in her room. She also enjoys hot sauce." },
      { name: "Chris",    src: "friends/chris.jpeg",    caption: "Chris is full of energy and loves being on AUX or queuing songs during group gatherings. He studies Photography and goes skiing every winter." }
    ];

    /* ============================================================== */

    (function () {
      var stage = document.getElementById("stage");
      var grid = document.getElementById("grid");

      // ----- build the grid (no names shown) -----
      var imgs = FRIENDS.map(function (f, i) {
        var b = document.createElement("button");
        b.className = "tile";
        b.type = "button";
        b.setAttribute("aria-label", f.name);
        var img = document.createElement("img");
        img.alt = f.name;
        img.src = f.src;
        b.appendChild(img);
        b.addEventListener("click", function () { openBox(i); });
        grid.appendChild(b);
        return img;
      });

      // width ÷ height of each image, as soon as the browser knows it
      function ratioOf(img) {
        return new Promise(function (done) {
          function finish() { done(img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 0); }
          if (img.complete) return finish();
          img.addEventListener("load", finish);
          img.addEventListener("error", finish);
          (function poll() {
            if (img.naturalWidth) return finish();
            if (!img.complete) requestAnimationFrame(poll);
          })();
        });
      }

      /* Every square of the grid has the same shape (the typical shape of
         the collages), and the 3 x 3 grid is made as big as fits on screen.
         Each collage sits whole inside its square, never stretched. */
      function layout(cellRatio) {
        var phone = window.matchMedia("(max-width: 760px)").matches;
        var gap = parseFloat(getComputedStyle(grid).columnGap) || 6;
        var cs = getComputedStyle(stage);
        var W = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        var H = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        var rows = Math.ceil(FRIENDS.length / 3);
        var w = (W - 2 * gap) / 3;
        if (!phone) w = Math.min(w, ((H - (rows - 1) * gap) / rows) * cellRatio);
        grid.style.setProperty("--cell-w", w + "px");
        grid.style.setProperty("--cell-h", w / cellRatio + "px");
        grid.classList.add("ready");
      }

      Promise.all(imgs.map(ratioOf)).then(function (ratios) {
        var ok = ratios.filter(function (r) { return r > 0; }).sort();
        var cellRatio = ok.length ? ok[Math.floor(ok.length / 2)] : 0.7;   // the typical shape
        layout(cellRatio);
        var t;
        window.addEventListener("resize", function () {
          clearTimeout(t);
          t = setTimeout(function () { layout(cellRatio); }, 60);
        });
      });

      // ----- enlarged view: ESC or click anywhere to close, arrows to move -----
      var box = document.getElementById("lightbox");
      var big = document.getElementById("lb-img");
      var nameEl = document.getElementById("lb-name");
      var capEl = document.getElementById("lb-caption");
      var current = -1;

      function show(i) {
        current = (i + FRIENDS.length) % FRIENDS.length;
        var f = FRIENDS[current];
        big.src = f.src;
        big.alt = f.name;
        nameEl.textContent = f.name;
        capEl.textContent = f.caption;
        new Image().src = FRIENDS[(current + 1) % FRIENDS.length].src;                    // load next
        new Image().src = FRIENDS[(current - 1 + FRIENDS.length) % FRIENDS.length].src;   // load previous
      }
      function openBox(i) {
        show(i);
        box.hidden = false;
        document.body.classList.add("lb-open");
      }
      function closeBox() {
        box.hidden = true;
        current = -1;
        document.body.classList.remove("lb-open");
      }

      box.addEventListener("click", closeBox);
      document.addEventListener("keydown", function (e) {
        if (current < 0) return;
        if (e.key === "Escape") closeBox();
        else if (e.key === "ArrowRight") { e.preventDefault(); show(current + 1); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); show(current - 1); }
      });

      // swipe on phones
      var startX = null;
      box.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; }, { passive: true });
      box.addEventListener("touchend", function (e) {
        if (startX === null || current < 0) return;
        var dx = e.changedTouches[0].clientX - startX;
        startX = null;
        if (dx > 40) show(current - 1);
        else if (dx < -40) show(current + 1);
      });
    })();
  </script>
    <script src="menu.js"></script>
</body>
</html>
