<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Collage | Amandine Mangon</title>
  <!-- The homepage collage on its own, so the Code page can show it in a frame.
       It uses the same files as the homepage (the "collage" folder). -->

  <script src="collage/p5.min.js"></script>
  <script src="collage/p5.sound.min.js"></script>
  <script src="collage/sketch.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: clamp(12px, calc(0.5vw + 6.5px), 17px);
      text-transform: uppercase;
    }
    /* same box and cropping as the homepage */
    .collage {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    .collage canvas {
      position: absolute;
      display: block;
      left: calc(-100% * 85 / 1840);
      top: calc(-100% * 25 / 880);
      width: calc(100% * 1960 / 1840) !important;
      height: calc(100% * 920 / 880) !important;
    }
    .collage[data-screen="home"] canvas { left: calc(100% * 195 / 1840); }
    .collage[data-screen="finalCollage"] canvas { left: calc(-100% * 60 / 1840); }

    .collage-input {
      position: absolute;
      left: 46%;
      top: 48%;
      transform: translate(-50%, -50%);
      width: 52%;
      padding: 0.6em 0.2em;
      border: 0;
      border-bottom: 1px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      font: inherit;
      text-transform: uppercase;
      outline: none;
      z-index: 5;
    }
    .collage-input::placeholder { color: #999; }

    .collage-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .collage:has(canvas) .collage-loading { display: none; }
  </style>
</head>
<body>
  <div class="collage" id="collage">
    <div class="collage-loading">Loading</div>
  </div>
</body>
</html>
