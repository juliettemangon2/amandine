<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Postcards | Amandine Mangon</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    :root {
      --pad-x: clamp(18px, 2.3vw, 44px);   /* left/right page margin (same as homepage) */
      --pad-y: clamp(18px, 3.6vh, 40px);   /* top/bottom page margin (same as homepage) */
      --fs: clamp(12px, calc(0.5vw + 6.5px), 17px);
      --gap: clamp(4px, 0.45vw, 8px);      /* space between postcards */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { background: #fff; }
    body {
      color: #000;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: var(--fs);
      line-height: 1.25;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:hover,
    .current {
      text-decoration: underline;
      text-decoration-thickness: 0.09em;
      text-underline-offset: 0.18em;
    }

    /* ---------- top left: COLLAGE + its pages ---------- */
    .section-nav {
      position: fixed;
      top: var(--pad-y);
      left: var(--pad-x);
      z-index: 10;
    }
    .nav-row { display: flex; flex-wrap: wrap; column-gap: 0.95em; }

    /* ---------- top right: name, goes home ---------- */
    .site-name {
      position: fixed;
      top: var(--pad-y);
      right: var(--pad-x);
      z-index: 10;
    }

    /* ---------- postcards ---------- */
    .stage {
      height: 100vh;
      height: 100dvh;
      padding: calc(var(--pad-y) + 4.5em) var(--pad-x) calc(var(--pad-y) + 1.5em);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .fit {
      display: flex;
      gap: var(--gap);
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .fit.ready { opacity: 1; }
    .fit-col { display: flex; flex-direction: column; gap: var(--gap); }
    .tile {
      display: block;
      padding: 0;
      border: 0;
      background: #f1f1f1;
      cursor: pointer;
    }
    .tile img {
      display: block;
      width: 100%;
      height: 100%;
      transition: opacity 0.25s ease;
    }
    .tile:hover img { opacity: 0.82; }
    .tile:focus:not(:focus-visible) { outline: none; }

    /* ---------- enlarged postcard ---------- */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.93);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vh 4vw;
      cursor: pointer;
    }
    .lightbox[hidden] { display: none; }
    .lightbox img { max-width: 92vw; max-height: 90vh; }
    body.lb-open { overflow: hidden; }

    /* ---------- phones: 2 columns, scroll down ---------- */
    @media (max-width: 760px) {
      .stage { height: auto; overflow: visible; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <nav class="section-nav">
    <div class="nav-row"><a href="postcards.html">Collage</a></div>
    <div class="nav-row">
      <a href="postcards.html" class="current">Postcards</a>
      <a href="friends.html">Friends</a>
      <a href="girl.html">Girl</a>
    </div>
  </nav>

  <a class="site-name" href="index.html">Amandine Mangon</a>

  <main class="stage" id="stage">
    <div class="fit" id="fit"></div>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    /* ==============================================================
       POSTCARDS — in order. They are in the "photos" folder.
       ============================================================== */
    var FOLDER = "photos/";
    var POSTCARDS = [
      "dancingwomen.jpeg", "plants.jpeg", "support.jpeg", "whisper.jpeg", "colors.jpeg",
      "horse.jpeg", "nuns.jpeg", "wedding.jpeg", "death.jpeg", "cage.jpeg",
      "smalltalk.jpeg", "pig.jpeg", "mouse.jpeg", "usafire.jpeg", "baptism.jpeg",
      "islam.jpeg", "exploration.jpeg", "ecosystem.jpeg", "stare.jpeg", "fishing.jpeg"
    ];
    var COLUMNS = 5;          // 5 across (4 down with 20 postcards)
    var PHONE_COLUMNS = 2;

    /* ============================================================== */

    (function () {
      var stage = document.getElementById("stage");
      var fit = document.getElementById("fit");
      var srcs = POSTCARDS.map(function (f) { return FOLDER + encodeURIComponent(f); });

      // ----- build the tiles -----
      var tiles = srcs.map(function (src, i) {
        var b = document.createElement("button");
        b.className = "tile";
        b.type = "button";
        b.setAttribute("aria-label", "Open postcard " + (i + 1));
        var img = document.createElement("img");
        img.alt = "";
        img.src = src;
        b.appendChild(img);
        b.addEventListener("click", function () { openBox(i); });
        return { el: b, img: img };
      });

      // width ÷ height of each image, as soon as the browser knows it
      function ratioOf(img) {
        return new Promise(function (done) {
          function finish() { done(img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 0.7); }
          if (img.complete) return finish();
          img.addEventListener("load", finish);
          img.addEventListener("error", finish);
          (function poll() {
            if (img.naturalWidth) return finish();
            if (!img.complete) requestAnimationFrame(poll);
          })();
        });
      }

      /* Layout: postcards go into columns (1st, 2nd, 3rd... across, then the
         next row). Each column gets its own width so that every column ends
         at exactly the same height — the whole set makes a clean rectangle
         and no image is stretched or cropped. */
      function layout(ratios) {
        var phone = window.matchMedia("(max-width: 760px)").matches;
        var k = Math.min(phone ? PHONE_COLUMNS : COLUMNS, ratios.length);
        var gap = parseFloat(getComputedStyle(fit).columnGap) || 6;
        var cs = getComputedStyle(stage);
        var W = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        var H = phone ? Infinity : stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);

        var cols = [];
        for (var c = 0; c < k; c++) cols.push([]);
        ratios.forEach(function (r, i) { cols[i % k].push(i); });

        // for a column of width w: height = w × S + (n − 1) × gap
        var S = cols.map(function (col) { return col.reduce(function (s, i) { return s + 1 / ratios[i]; }, 0); });
        var num = W - (k - 1) * gap, den = 0;
        cols.forEach(function (col, c) { num += gap * (col.length - 1) / S[c]; den += 1 / S[c]; });
        var height = Math.min(H, num / den);   // as tall as fits, but never wider than the space

        fit.innerHTML = "";
        cols.forEach(function (col, c) {
          var w = (height - (col.length - 1) * gap) / S[c];
          var colEl = document.createElement("div");
          colEl.className = "fit-col";
          colEl.style.width = w + "px";
          col.forEach(function (i) {
            tiles[i].el.style.width = w + "px";
            tiles[i].el.style.height = w / ratios[i] + "px";
            colEl.appendChild(tiles[i].el);
          });
          fit.appendChild(colEl);
        });
        fit.classList.add("ready");
      }

      Promise.all(tiles.map(function (t) { return ratioOf(t.img); })).then(function (ratios) {
        layout(ratios);
        var t;
        window.addEventListener("resize", function () {
          clearTimeout(t);
          t = setTimeout(function () { layout(ratios); }, 60);
        });
      });

      // ----- enlarged view: ESC or click anywhere to close, arrows to move -----
      var box = document.getElementById("lightbox");
      var big = document.getElementById("lightbox-img");
      var current = -1;

      function show(i) {
        current = (i + srcs.length) % srcs.length;
        big.src = srcs[current];
        new Image().src = srcs[(current + 1) % srcs.length];               // load next
        new Image().src = srcs[(current - 1 + srcs.length) % srcs.length]; // load previous
      }
      function openBox(i) {
        show(i);
        box.hidden = false;
        document.body.classList.add("lb-open");
      }
      function closeBox() {
        box.hidden = true;
        current = -1;
        document.body.classList.remove("lb-open");
      }

      box.addEventListener("click", closeBox);
      document.addEventListener("keydown", function (e) {
        if (current < 0) return;
        if (e.key === "Escape") closeBox();
        else if (e.key === "ArrowRight") { e.preventDefault(); show(current + 1); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); show(current - 1); }
      });

      // swipe on phones
      var startX = null;
      box.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; }, { passive: true });
      box.addEventListener("touchend", function (e) {
        if (startX === null || current < 0) return;
        var dx = e.changedTouches[0].clientX - startX;
        startX = null;
        if (dx > 40) show(current - 1);
        else if (dx < -40) show(current + 1);
      });
    })();
  </script>
    <script src="menu.js"></script>
</body>
</html>
