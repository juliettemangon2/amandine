<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code | Amandine Mangon</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    :root {
      --pad-x: clamp(18px, 2.3vw, 44px);   /* left/right page margin (same as homepage) */
      --pad-y: clamp(18px, 3.6vh, 40px);   /* top/bottom page margin (same as homepage) */
      --fs: clamp(12px, calc(0.5vw + 6.5px), 17px);
      --gap: clamp(14px, 1.5vw, 28px);
      --content-w: min(70vw, 1300px);      /* widest the work (and the explanation images) can be */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { background: #fff; }
    body {
      color: #000;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: var(--fs);
      line-height: 1.25;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:hover,
    .current {
      text-decoration: underline;
      text-decoration-thickness: 0.09em;
      text-underline-offset: 0.18em;
    }

    /* ---------- top left: DIGITAL / CODE + projects ---------- */
    .section-nav {
      position: fixed;
      top: var(--pad-y);
      left: var(--pad-x);
      right: 30vw;
      z-index: 10;
    }
    .nav-row { display: flex; flex-wrap: wrap; column-gap: 1.9em; }
    .nav-row a.back:hover { text-decoration: none; }   /* DIGITAL goes back, without an underline */

    /* ---------- top right: name, goes home ---------- */
    .site-name {
      position: fixed;
      top: var(--pad-y);
      right: var(--pad-x);
      z-index: 10;
    }

    /* ---------- the area under the top bar: scrolls on its own ---------- */
    .stage {
      position: fixed;
      inset: calc(var(--pad-y) + 4.5em) 0 0 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }
    .stage::-webkit-scrollbar { display: none; }

    /* first screen: the working project, centered, caption underneath */
    .first {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--pad-x) calc(var(--pad-y) + 1.5em);
    }
    .piece { display: flex; flex-direction: column; }
    .piece iframe {
      display: block;
      border: 0;
      background: #fff;
    }
    .caption { margin-top: 1.1em; }
    .caption .desc { margin-top: 1.3em; }
    .caption p:empty { display: none; }

    /* after scrolling: explanation images, full width of the content */
    .more {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--gap);
      padding: 0 var(--pad-x) calc(var(--pad-y) + 2em);
    }
    .more img {
      display: block;
      width: var(--content-w);
      max-width: 100%;
      height: auto;
    }

    /* ---------- phones ---------- */
    @media (max-width: 760px) {
      .section-nav { right: var(--pad-x); }
      .stage { inset: calc(var(--pad-y) + 6em) 0 0 0; }
      .first { height: auto; padding-top: 1em; padding-bottom: 3em; }
      .piece { width: 100%; }
      .more img { width: 100%; }
    }
  </style>
</head>
<body>

  <nav class="section-nav">
    <div class="nav-row"><span><a class="back" href="digital.html">Digital</a> / Code</span></div>
    <div class="nav-row" id="tabs"></div>
  </nav>

  <a class="site-name" href="index.html">Amandine Mangon</a>

  <main class="stage" id="stage"></main>

  <script>
    /* ==============================================================
       PROJECTS — one tab each, in this order.
       page     = the working project shown in the middle
       shape    = width ÷ height of it (leave out to use all the space)
       name / classLine / desc = the caption underneath
                  (desc can have several lines; each "..." is one line)
       captionFrom = where the caption starts, as a share of the width
                  (0.16 = lines up with the collage's artboard)
       captionCenter: true = caption centered under the work
       images   = pictures you see when you scroll down
       ============================================================== */
    var PROJECTS = [
      {
        id: "custom-collage",
        name: "Custom Collage",
        page: "collage-embed.html",
        shape: 1840 / 880,
        captionFrom: 0.16,
        classLine: "Creative Coding; NYU IDM, Fall 2025.",
        desc: [
          "Creative coding final project; p5.js.",
          "Seen on the home page. Inspired by my postcard series, my first personal art project, from Spring 2025."
        ],
        images: []
      },
      {
        id: "exquisite-corpse",
        name: "Exquisite Corpse",
        page: "exquisite-corpse/index.html",
        noCaption: true,
        classLine: "",          // WRITE THE CLASS LINE HERE, e.g. "Creative Coding; NYU IDM, Fall 2025."
        desc: [""],             // WRITE THE DESCRIPTION HERE, e.g. "Click each part to change it; p5.js."
        images: [
          "exquisite-corpse/ExquisiteCorpseExplained1.jpeg",
          "exquisite-corpse/ExquisiteCorpseExplained2.jpeg"
        ]
      }
      ,
      {
        id: "five-stages-of-grief",
        name: "The Five Stages of Grief",
        page: "five-stages-of-grief/index.html",
        noCaption: true,
        images: [
          "five-stages-of-grief/5stages1.jpeg",
          "five-stages-of-grief/5stages2.jpeg"
        ]
      }
    ];

    /* ============================================================== */

    (function () {
      var tabs = document.getElementById("tabs");
      var stage = document.getElementById("stage");
      var project, frame, caption;

      PROJECTS.forEach(function (p) {
        var a = document.createElement("a");
        a.href = "#" + p.id;
        a.textContent = p.name;
        a.setAttribute("data-id", p.id);
        tabs.appendChild(a);
      });

      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      function load() {
        var id = (location.hash || "").slice(1).toLowerCase();
        project = PROJECTS.filter(function (p) { return p.id === id; })[0] || PROJECTS[0];
        Array.prototype.forEach.call(tabs.children, function (a) {
          a.classList.toggle("current", a.getAttribute("data-id") === project.id);
        });
        document.title = project.name + " | Amandine Mangon";

        // (switching tabs removes the old project, which also stops its sound)
        stage.innerHTML = "";
        stage.scrollTop = 0;

        var first = el("section", "first");
        var piece = el("div", "piece");
        frame = el("iframe");
        frame.src = project.page;
        frame.title = project.name;
        frame.setAttribute("allow", "autoplay");
        caption = el("div", "caption");
        caption.appendChild(el("p", null, project.name));
        caption.appendChild(el("p", null, project.classLine || ""));
        (project.desc || []).forEach(function (line, i) {
          caption.appendChild(el("p", i === 0 ? "desc" : null, line));
        });
        piece.appendChild(frame);
        piece.appendChild(caption);
        if (project.noCaption) caption.style.display = "none";
        first.appendChild(piece);
        stage.appendChild(first);

        if (project.images && project.images.length) {
          var more = el("section", "more");
          project.images.forEach(function (src) {
            var img = el("img");
            img.src = src;
            img.alt = project.name;
            img.loading = "lazy";
            img.addEventListener("error", function () { img.remove(); });   // not added yet → just hide it
            more.appendChild(img);
          });
          stage.appendChild(more);
        }
        size();
      }

      /* Make the project as big as fits in the first screen,
         with its caption underneath, the same width as the project. */
      function size() {
        if (!frame) return;
        var phone = window.matchMedia("(max-width: 760px)").matches;
        var first = stage.querySelector(".first");
        var cs = getComputedStyle(first);
        var maxW = Math.min(window.innerWidth * 0.7, 1300);
        if (phone) maxW = first.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        caption.style.width = maxW + "px";
        var capH = caption.offsetHeight + parseFloat(getComputedStyle(caption).marginTop);
        var H = first.clientHeight - parseFloat(cs.paddingBottom) - capH;
        var w = maxW, h = phone ? window.innerHeight * 0.7 : H;
        if (project.shape) {
          h = w / project.shape;
          if (!phone && h > H) { h = H; w = h * project.shape; }
        }
        frame.style.width = w + "px";
        frame.style.height = h + "px";
        var from = phone ? 0 : (project.captionFrom || 0);
        caption.style.marginLeft = w * from + "px";
        caption.style.width = w * (1 - 2 * from) + "px";
        caption.style.textAlign = project.captionCenter ? "center" : "left";
      }

      window.addEventListener("resize", size);
      window.addEventListener("hashchange", load);
      load();
    })();
  </script>
</body>
</html>
