<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphic Design | Amandine Mangon</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    :root {
      --pad-x: clamp(18px, 2.3vw, 44px);   /* left/right page margin (same as homepage) */
      --pad-y: clamp(18px, 3.6vh, 40px);   /* top/bottom page margin (same as homepage) */
      --fs: clamp(12px, calc(0.5vw + 6.5px), 17px);
      --thumb-w: min(10vw, 180px);         /* width of the thumbnail column */
      --info-w: min(25vw, 28em);           /* width of the text */
      --gap: clamp(14px, 1.5vw, 28px);
      --widest: 1.6;                       /* the widest image's width ÷ height (Laura desktop) */

      /* ONE height for every image on every project: as tall as possible (up to 58%
         of the screen) while the widest image + thumbnails + text still fit across. */
      --main-h: min(58vh, calc((90vw - var(--thumb-w) - var(--info-w) - 2 * var(--gap)) / var(--widest)));
      --area-w: calc(var(--main-h) * var(--widest));   /* space kept for the image */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { background: #fff; }
    body {
      color: #000;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: var(--fs);
      line-height: 1.25;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:hover,
    .current {
      text-decoration: underline;
      text-decoration-thickness: 0.09em;
      text-underline-offset: 0.18em;
    }

    /* ---------- top left: DIGITAL / GRAPHIC DESIGN + projects ---------- */
    .section-nav {
      position: fixed;
      top: var(--pad-y);
      left: var(--pad-x);
      right: 30vw;
      z-index: 10;
    }
    .nav-row { display: flex; flex-wrap: wrap; column-gap: 1.9em; }
    .nav-row a.back:hover { text-decoration: none; }   /* DIGITAL goes back, without an underline */

    /* ---------- top right: name, goes home ---------- */
    .site-name {
      position: fixed;
      top: var(--pad-y);
      right: var(--pad-x);
      z-index: 10;
    }

    /* ---------- thumbnails | big image | text ---------- */
    .stage {
      height: 100vh;
      height: 100dvh;
      padding: calc(var(--pad-y) + 4.5em) var(--pad-x) calc(var(--pad-y) + 1.5em);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* thumbnails | image + text. Every project uses the same widths, so the
       thumbnails, the image and the top/bottom line sit in exactly the same
       place on every tab. */
    .project {
      display: flex;
      align-items: flex-end;
      gap: var(--gap);
    }
    .work {
      width: calc(var(--area-w) + var(--gap) + var(--info-w));
      display: flex;
      align-items: flex-end;          /* text lines up with the bottom of the image */
      gap: var(--gap);
    }

    /* thumbnail column: scrolls on its own */
    .thumbs {
      width: var(--thumb-w);
      height: var(--main-h);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }
    .thumbs::-webkit-scrollbar { display: none; }
    .thumb {
      display: block;
      flex: none;
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.2s ease;
    }
    .thumb img { display: block; width: 100%; height: auto; }
    .thumb:hover, .thumb.on { opacity: 1; }
    .thumb:focus:not(:focus-visible) { outline: none; }
    .divider { flex: none; height: 1px; background: #000; }   /* line between the two projects */

    /* big image: always the same height, the text sits right next to it */
    .main {
      flex: none;
      height: var(--main-h);
      display: flex;
      align-items: flex-end;
      gap: var(--gap);
    }
    .main img {
      display: block;
      height: var(--main-h);
      width: auto;
      max-width: var(--area-w);
      object-fit: contain;
    }

    /* black border on the images (projects marked border: true) */
    .bordered .main img,
    .bordered .thumb img { border: 1px solid #000; }

    /* projects with one image, or with all images shown together: the thumbnail
       column is hidden but its space is kept, so the image doesn't move */
    .no-thumbs .thumbs { visibility: hidden; }

    /* small images stretched so together they're exactly as tall as the big image (fillThumbs: true) */
    .fill-thumbs .thumbs { width: auto; overflow: visible; }
    .fill-thumbs .thumb { width: auto; }
    .fill-thumbs .thumb img {
      width: auto;
      height: calc((var(--main-h) - (var(--count) - 1) * var(--gap)) / var(--count));
    }
    /* all images side by side at the same height (projects marked together: true) */
    .main.together img { max-width: calc((var(--area-w) - var(--gap)) / 2); }

    .info { flex: 1; min-width: 0; }
    .info p + p { margin-top: 0; }
    .info .desc { margin-top: 1.3em; }

    /* ---------- click the big image: it opens larger ---------- */
    .main img { cursor: zoom-in; }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.93);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vh 4vw;
      cursor: zoom-out;
    }
    .lightbox[hidden] { display: none; }
    .lightbox img { display: block; max-width: 92vw; max-height: 90vh; }
    /* ---------- phones: big image, thumbnails in a row, then text ---------- */
    @media (max-width: 760px) {
      .stage { height: auto; display: block; padding-top: calc(var(--pad-y) + 6.5em); padding-left: var(--pad-x); }
      .section-nav { right: var(--pad-x); }
      .project, .work { flex-direction: column; align-items: stretch; width: 100%; }
      .project .work { order: 1; }
      .main { width: 100%; height: auto; }
      .main img { width: 100%; height: auto; max-width: none; }
      .main.together img { width: calc(50% - var(--gap) / 2); max-width: none; }
      .thumbs { order: 2; width: 100%; height: auto; flex-direction: row; overflow-x: auto; overflow-y: hidden; }
      .no-thumbs .thumbs { display: none; }
      .thumb { width: 22vw; }
      .divider { width: 1px; height: auto; }
    }
  </style>
</head>
<body>

  <nav class="section-nav">
    <div class="nav-row"><span><a class="back" href="digital.html">Digital</a> / Graphic Design</span></div>
    <div class="nav-row" id="tabs"></div>
  </nav>

  <a class="site-name" href="index.html">Amandine Mangon</a>

  <main class="stage">
    <div class="project" id="project">
      <div class="thumbs" id="thumbs"></div>
      <div class="work">
        <div class="main" id="main"></div>
        <div class="info">
          <p id="info-name"></p>
          <p id="info-class"></p>
          <p class="desc" id="info-desc"></p>
        </div>
      </div>
    </div>
  </main>
  <!-- larger view: ESC or click anywhere to close, arrows to move -->
  <div class="lightbox" id="lightbox" hidden>
    <img id="lightbox-img" src="" alt="">
  </div>
  <script>
    /* ==============================================================
       PROJECTS — one tab each, in this order.
       border: true    → thin black border around the images
       together: true  → all images side by side (no thumbnail column)
       ============================================================== */
    var CLASS_LINE = "Visual Foundation Studio; NYU IDM, Fall 2025.";

    var PROJECTS = [
      { id: "laura", name: "Laura", border: true, parts: [
        { desc: "Brand Guidelines and Desktop website portfolio; ADOBE ILLUSTRATOR.", images: [
          "digital/lauraguide.png", "digital/laurahome.png", "digital/lauracontent.png",
          "digital/lauraarch.png", "digital/lauraphoto.png", "digital/laurafashion.png"
        ]},
        { desc: "iPhone website portfoliO; ADOBE ILLUSTRATOR.", images: [
          "digital/lauraiphone.png", "digital/iphonecontent.png", "digital/iphonearch.png"
        ]}
      ]},
      { id: "blue-father", name: "Blue Father", border: true, parts: [
        { desc: "Brand guidelines for an upcoming tour for a fictional artist; ADOBE ILLUSTRATOR.", images: [
          "digital/brandcover.png", "digital/brandlogo.png", "digital/brandicon.png",
          "digital/brandcolor.png", "digital/brandrules.png", "digital/brandtype.png",
          "digital/brandapplication.png"
        ]},
        { desc: "Merch for the tour; ADOBE ILLUSTRATOR.", images: [
          "digital/deanfront.png", "digital/dean1.png", "digital/dean2-3.png",
          "digital/dean4-5.png", "digital/dean6-7.png", "digital/dean8-9.png",
          "digital/dean10-11.png", "digital/dean12-13.png", "digital/dean14-15.png",
          "digital/dean16-17.png", "digital/dean18-19.png"
        ]}
      ]},
      { id: "iconoclast", name: "Iconoclast", border: true, parts: [
        { desc: "Magazine grid; ADOBE INDESIGN.", images: [
          "digital/iconoclast.jpeg", "digital/melody.jpeg", "digital/muse.jpeg", "digital/genes.jpeg", "digital/follows.jpg"
        ]}
      ]},
      { id: "zaha-hadid", name: "Zaha Hadid", border: true, parts: [
        { desc: "Architect flyer. Graphics are hand drawn iNSPIRED BY ZAHA HADID ArchitectURE; Adobe Illustrator.", images: ["digital/zahahadid.jpeg"] }
      ]},
      { id: "evidemment", name: "Evidemment", parts: [
        { desc: "Album cover; adobe illustrator.", images: ["digital/albumfront.png", "digital/albumback.png"] }
      ]},
{ id: "good-mourning", name: "Good Mourning", fillThumbs: true, parts: [        { desc: "Political posters; Adobe illustrator.", images: ["digital/goodmourning.png", "digital/shoothere.png"] }
      ]}
    ];

    /* ============================================================== */

    (function () {
      var tabs = document.getElementById("tabs");
      var thumbs = document.getElementById("thumbs");
      var main = document.getElementById("main");
      var projectEl = document.getElementById("project");
      var mainImg = document.createElement("img");
      var infoName = document.getElementById("info-name");
      var infoClass = document.getElementById("info-class");
      var infoDesc = document.getElementById("info-desc");

      var project, flat = [], current = 0;

      // ----- click the big image to see it larger -----
      var box = document.getElementById("lightbox");
      var big = document.getElementById("lightbox-img");
      function openBig(src) {
        big.src = src;
        box.hidden = false;
        document.body.style.overflow = "hidden";
      }
      function closeBig() {
        box.hidden = true;
        document.body.style.overflow = "";
      }
      mainImg.addEventListener("click", function () { openBig(flat[current].src); });
      box.addEventListener("click", closeBig);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !box.hidden) closeBig();
      });
      // tabs: LAURA  BLUE FATHER  ICONOCLAST ...
      PROJECTS.forEach(function (p) {
        var a = document.createElement("a");
        a.href = "#" + p.id;
        a.textContent = p.name;
        a.setAttribute("data-id", p.id);
        tabs.appendChild(a);
      });

      function show(i) {
        current = (i + flat.length) % flat.length;
        var item = flat[current];
        if (!project.together) {
          mainImg.src = item.src;
          mainImg.alt = project.name;
        }
         if (!box.hidden) big.src = item.src;
        infoName.textContent = project.name;
        infoClass.textContent = CLASS_LINE;
        infoDesc.textContent = item.part.desc;
        Array.prototype.forEach.call(thumbs.querySelectorAll(".thumb"), function (t, n) {
          t.classList.toggle("on", n === current);
        });
        var on = thumbs.querySelectorAll(".thumb")[current];
        if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest", inline: "nearest" });
      }

      function load() {
        var id = (location.hash || "").slice(1).toLowerCase();
        project = PROJECTS.filter(function (p) { return p.id === id; })[0] || PROJECTS[0];
        Array.prototype.forEach.call(tabs.children, function (a) {
          a.classList.toggle("current", a.getAttribute("data-id") === project.id);
        });
        document.title = project.name + " | Amandine Mangon";

        thumbs.innerHTML = "";
        flat = [];
        project.parts.forEach(function (part, pi) {
          if (pi > 0) {
            var line = document.createElement("div");
            line.className = "divider";
            thumbs.appendChild(line);
          }
          part.images.forEach(function (src) {
            var i = flat.length;
            flat.push({ src: src, part: part });
            var b = document.createElement("button");
            b.className = "thumb";
            b.type = "button";
            b.setAttribute("aria-label", "Show image " + (i + 1));
            var img = document.createElement("img");
            img.src = src;
            img.alt = "";
            b.appendChild(img);
            b.addEventListener("click", function () { show(i); });
            thumbs.appendChild(b);
          });
        });
        thumbs.scrollTop = 0;

        projectEl.classList.toggle("bordered", !!project.border);
        projectEl.classList.toggle("fill-thumbs", !!project.fillThumbs);
        thumbs.style.setProperty("--count", flat.length);
        projectEl.classList.toggle("no-thumbs", !!project.together || flat.length < 2);
        main.classList.toggle("together", !!project.together);
        main.innerHTML = "";
        if (project.together) {
          flat.forEach(function (item) {
            var img = document.createElement("img");
            img.src = item.src;
            img.alt = project.name;
            main.appendChild(img);
          });
        } else {
          main.appendChild(mainImg);
        }
        show(0);
      }

      window.addEventListener("hashchange", load);
      load();

      // arrow keys move through the images (← → or ↑ ↓)
      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); show(current + 1); }
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); show(current - 1); }
      });

      // scrolling anywhere on the page scrolls the thumbnail column
      window.addEventListener("wheel", function (e) {
        if (window.matchMedia("(max-width: 760px)").matches) return;
        if (thumbs.contains(e.target)) return;
        thumbs.scrollTop += e.deltaY;
      }, { passive: true });
    })();
  </script>
</body>
</html>
